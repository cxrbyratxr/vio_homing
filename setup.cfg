[pycodestyle]
max-line-length = 79
# MAVLINK20 must be selected before importing pymavlink.
# PEP 8 places operators before continued expressions.
ignore = E402,W503,W504

[yapf]
based_on_style = pep8
column_limit = 79
indent_width = 4
dedent_closing_brackets = true
split_before_logical_operator = true
